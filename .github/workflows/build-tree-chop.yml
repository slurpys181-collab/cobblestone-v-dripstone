name: Build Tree Chop MCPACK
on:
  push:
    branches: ["main"]
    paths:
      - "tree-chop/**"
      - ".github/workflows/build-tree-chop.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build pack
        run: |
          rm -f Tree-Chop.mcpack
          (cd tree-chop && zip -q -r ../Tree-Chop.mcpack manifest.json scripts pack_icon.png)
      - name: Commit built pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tree-Chop.mcpack
          if git diff --cached --quiet; then
            echo "Tree Chop pack is already up to date."
            exit 0
          fi
          git commit -m "Build Tree Chop MCPACK [skip ci]"
          git push origin HEAD:main
