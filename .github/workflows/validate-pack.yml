name: Validate dripstone behavior pack

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate MCPACK ZIP, manifest, recipe, icon, and source consistency
        run: python3 tests/validate_pack.py
